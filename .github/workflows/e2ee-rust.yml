name: E2EE native and Flutter checks

on:
  pull_request:
    paths:
      - "rust/**"
      - "lib/core/e2ee/**"
      - "test/core/e2ee/**"
      - "pubspec.yaml"
      - "pubspec.lock"
      - ".github/workflows/e2ee-rust.yml"
  push:
    branches:
      - feature/story-video-post-reshare
    paths:
      - "rust/**"
      - "lib/core/e2ee/**"
      - "test/core/e2ee/**"
      - "pubspec.yaml"
      - "pubspec.lock"
      - ".github/workflows/e2ee-rust.yml"

permissions:
  contents: read

jobs:
  flutter:
    name: Flutter E2EE unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Resolve Flutter dependencies
        run: flutter pub get
      - name: Analyze E2EE Dart code
        run: dart analyze lib/core/e2ee test/core/e2ee
      - name: Run E2EE unit tests
        run: flutter test test/core/e2ee

  bridge-generation:
    name: Generate Rust Dart bindings
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - uses: dtolnay/rust-toolchain@stable
      - name: Install pinned bridge generator
        run: cargo install --locked --version 2.13.0 flutter_rust_bridge_codegen
      - name: Resolve Flutter dependencies
        run: flutter pub get
      - name: Generate bindings from the checked-in configuration
        run: flutter_rust_bridge_codegen generate
      - name: Publish generated bridge as a review artifact
        uses: actions/upload-artifact@v4
        with:
          name: scrole-e2ee-bridge-generated
          path: |
            lib/core/e2ee/bridge/
            rust/src/frb_generated.rs
          if-no-files-found: error

  rust-host:
    name: OpenMLS host tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - name: Resolve pinned Rust dependency graph
        working-directory: rust
        run: cargo generate-lockfile
      - name: Test native engine
        working-directory: rust
        run: cargo test --locked
      - name: Check native engine
        working-directory: rust
        run: cargo check --locked

  rust-android:
    name: OpenMLS Android ARM64 compile check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - name: Install Android NDK
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;27.2.12479018"
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - name: Check Android ARM64 target
        working-directory: rust
        run: |
          export ANDROID_HOME="/usr/local/lib/android/sdk"
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/27.2.12479018"
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang"
          cargo generate-lockfile
          cargo check --locked --target aarch64-linux-android

  rust-ios:
    name: OpenMLS iOS ARM64 compile check
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - name: Check iOS ARM64 target
        working-directory: rust
        run: |
          cargo generate-lockfile
          cargo check --locked --target aarch64-apple-ios

name: E2EE Rust engine checks

on:
  pull_request:
    paths:
      - "rust/**"
      - ".github/workflows/e2ee-rust.yml"
  push:
    branches:
      - feature/story-video-post-reshare
    paths:
      - "rust/**"
      - ".github/workflows/e2ee-rust.yml"

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - name: Test native engine
        working-directory: rust
        run: cargo test
      - name: Check native engine
        working-directory: rust
        run: cargo check
